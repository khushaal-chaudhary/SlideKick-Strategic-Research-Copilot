name: Keep-alive

# Aura Free pauses an instance after ~3 days of inactivity and deletes it
# after 30 days, so this touches the database every other day.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 */2 * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install neo4j

      - name: Ping Neo4j
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
        run: |
          python - <<'PY'
          import os
          from neo4j import GraphDatabase

          driver = GraphDatabase.driver(
              os.environ["NEO4J_URI"],
              auth=(os.environ["NEO4J_USERNAME"], os.environ["NEO4J_PASSWORD"]),
          )
          with driver.session(database=os.environ.get("NEO4J_DATABASE") or "neo4j") as session:
              print(session.run("MATCH (n) RETURN count(n) AS n").single()["n"], "nodes")
          driver.close()
          PY

      - name: Ping backend Space
        run: |
          curl -sS -m 120 -o /dev/null -w "space %{http_code}\n" https://khushaal-slidekick-agentic-system.hf.space/health
